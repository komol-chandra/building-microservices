# Phase 0: infrastructure only. Services are added phase by phase.
name: ${COMPOSE_PROJECT_NAME:-msstudy}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Every *.sql in this folder runs once, on first boot of an empty volume.
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"       # AMQP (apps)
      - "${RABBITMQ_UI_PORT}:15672"   # management UI (browser)
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ---------------- application services ----------------
  inventory-service:
    build: ./services/inventory
    init: true                      # tiny init process: forwards SIGTERM, reaps zombies
    environment:
      PORT: 4002
      DATABASE_URL: ${INVENTORY_DATABASE_URL}
    ports:
      - "${INVENTORY_PORT}:4002"    # public for now; Phase 3 hides it behind the gateway
    volumes:
      - ./services/inventory:/app   # live code reload
      - /app/node_modules           # keep the container's own node_modules (Linux engines)
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  adminer:
    image: adminer:4
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "${ADMINER_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  rabbitdata:
