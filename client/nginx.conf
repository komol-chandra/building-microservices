# Serves the built React app. Every unknown path falls back to index.html so
# client-side routes (/orders/123) work on a hard refresh or a deep link.
server {
  listen 80;
  listen [::]:80;   # "localhost" resolves to ::1 (IPv6) inside Alpine: the healthcheck needs this
  root /usr/share/nginx/html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Vite puts a content hash in asset file names → safe to cache "forever".
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Health check endpoint for Docker.
  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }
}
